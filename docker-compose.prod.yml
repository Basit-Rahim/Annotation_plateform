# Production stack. Usage (on the server, with .env filled in):
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy (web) is reachable from outside; Postgres and the API stay on the
# internal network. docker-compose.yml remains the development stack.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      AUDIO_DROP_DIR: /data/incoming
      AUDIO_STORAGE_DIR: /data/audio
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/incoming:/data/incoming
      - ./data/audio:/data/audio
    # Behind Caddy: trust its X-Forwarded-* headers so audit logs record the
    # real client IP. Safe because this container has no published port.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: ../deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump + audio archive into ./backups (see deploy/backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - ./data/audio:/data/audio:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pg_data:
  caddy_data:
  caddy_config:
