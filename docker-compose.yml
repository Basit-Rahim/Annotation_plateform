services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-side paths: the host folders from .env are mounted here.
      AUDIO_DROP_DIR: /data/incoming
      AUDIO_STORAGE_DIR: /data/audio
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${AUDIO_DROP_DIR:-./data/incoming}:/data/incoming
      - ${AUDIO_STORAGE_DIR:-./data/audio}:/data/audio
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pg_data:
